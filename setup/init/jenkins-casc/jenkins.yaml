jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  
  authorizationStrategy: unsecured
  
  disableRememberMe: false
  
  numExecutors: 2
  mode: NORMAL

unclassified:
  location:
    url: "http://localhost:9081/"
    adminAddress: "admin@lab.local"
    
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "ldap-admin"
              username: "cn=admin,dc=lab,dc=local"
              password: "adminpassword"
              description: "LDAP Admin Credentials"
          - usernamePassword:
              scope: GLOBAL
              id: "ci-cd-user"
              username: "goodusername"
              password: "LOUVRE"
              description: "They're not gonna try this one ..."
          - string:
              scope: GLOBAL
              id: "ci-cd-api-key"
              secret: "AIzaSyDaGmWKa4JsXZ-HjGw7ISLn_3namBGewQe"
              description: "API Key"
          - string:
              scope: GLOBAL
              id: "secret1"
              secret: "never gonna give you up"
              description: "Secret 1"
          - string:
              scope: GLOBAL
              id: "secret2"
              secret: "never gonna let you down"
              description: "Secret 2"
          - string:
              scope: GLOBAL
              id: "secret3"
              secret: "never gonna run around"
              description: "Secret 3"
          - string:
              scope: GLOBAL
              id: "secret4"
              secret: "and desert you"
              description: "Secret 4"
          - string:
              scope: GLOBAL
              id: "secret5"
              secret: "never gonna make you cry"
              description: "Secret 5"
          - string:
              scope: GLOBAL
              id: "secret6"
