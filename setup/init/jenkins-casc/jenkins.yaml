              id: "secret8"
              secret: "and hurt you"
              description: "Secret 8"
security:
  GlobalJobDslSecurityConfiguration:
    useScriptSecurity: false
  scriptApproval:
    approvedSignatures:
      - "staticMethod jenkins.model.Jenkins getInstance"
      - "method java.io.InputStream available"
      - "method java.io.InputStream read"
      - "method java.io.OutputStream write int"
      - "method java.lang.Process exitValue"
      - "method java.lang.Process getErrorStream"
      - "method java.lang.Process getInputStream"
      - "method java.lang.Process getOutputStream"
      - "method java.lang.ProcessBuilder redirectErrorStream boolean"
      - "method java.lang.ProcessBuilder start"
      - "method java.net.Socket getInputStream"
      - "method java.net.Socket getOutputStream"
      - "method java.net.Socket isClosed"
      - "new java.lang.ProcessBuilder java.lang.String[]"
      - "new java.net.Socket java.lang.String int"
      - "staticMethod java.lang.Thread sleep long"

jobs:
  - script: >
      pipelineJob('Hello-World') {
        definition {
          cps {
            script("""
              pipeline {
                agent any
                stages {
                  stage('print') {
                    steps {
                      echo 'Hello world'
                    }
                  }
                }
              }
            """.stripIndent())
          }
        }
      }
  - script: >
      pipelineJob('CICD Sanity Check') {
        definition {
          cps {
            script('''
              pipeline {
                agent any
                stages {
                  stage('Env setup') {
                    steps {
                      echo 'Setting up environment...'
                    }
                  }
                  stage('Configuring account') {
                    steps {
                      script {
                        def username = null;
                        def password = null;
                        withCredentials([usernamePassword(credentialsId: 'ci-cd-user', usernameVariable: 'CI_USERNAME', passwordVariable: 'CI_PASSWORD')]) {
                          username = CI_USERNAME;
                          password = CI_PASSWORD;
                          echo "Retrieving creds..."
                        }
                        echo "Starting account configuration tool in non-interactive mode"
                        echo "DEBUG: Retrieving creds from env"
                        echo "DEBUG: Login using $username:$password"
                        echo "DEBUG: Login successful"
                        echo "DEBUG: Checking profile..."
                        echo "Account configured successfully"
                      }
                    }
                  }
                  stage('Test API Key') {
                    steps {
                      script{
                        echo 'API Key testing...';
                        def api_key = null;
                        withCredentials([
                          string(credentialsId: 'ci-cd-api-key', variable: 'stored_api_key')
                        ]) {
                          echo "Retrieved API Key: $stored_api_key"
                          api_key = stored_api_key
                        }
                        echo "Running tests using API Key:$api_key";
                        echo "Test 1/5 - passed";
                        echo "Test 2/5 - passed";
                        echo "Test 3/5 - passed";
                        echo "Test 4/5 - passed";
                        echo "Test 5/5 - passed";
                        echo "All tests passed";
                      }
                    }
                  }
                  stage('Cleanup') {
                    steps {
                      echo 'Cleaning up environment'
                    }
                  }
                }
              }
            '''.stripIndent())
          }
        }
      }